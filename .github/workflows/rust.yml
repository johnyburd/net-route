name: Push or PR

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Platform-independent lint: run it once rather than on every OS in the matrix.
  lint:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: rustfmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check

  build_n_test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --locked --verbose

  # Semver checks, docs builds and publishing live in release.yml, which is scoped to
  # `main`.
